name: Reproducibility

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Dataset verification
        run: python verification/DV-001_Frozen_Dataset_Intake/dv001_frozen_dataset_intake.py
      - name: Execute notebooks from clean kernels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/executed_notebooks
          for nb in notebooks/*.ipynb; do
            echo "Executing $nb"
            jupyter nbconvert               --to notebook               --execute "$nb"               --ExecutePreprocessor.timeout=600               --output-dir /tmp/executed_notebooks
          done
      - name: Verify committed tables match regenerated outputs
        run: git diff --exit-code -- reports/tables
      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: |
            /tmp/executed_notebooks
            reports/figures
            reports/tables
          if-no-files-found: error
