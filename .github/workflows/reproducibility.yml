name: Reproducibility

permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Dataset verification
        run: python verification/DV-001_Frozen_Dataset_Intake/dv001_frozen_dataset_intake.py
      - name: Execute notebooks from clean kernels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/executed_notebooks
          for nb in notebooks/*.ipynb; do
            echo "Executing $nb"
            jupyter nbconvert               --to notebook               --execute "$nb"               --ExecutePreprocessor.timeout=600               --output-dir /tmp/executed_notebooks
          done
      - name: Verify committed tables match regenerated outputs
        run: python scripts/verify_table_reproducibility.py
      - name: One-time final audit evidence snapshot
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/final-audit-closure'
        shell: bash
        run: |
          set -euo pipefail
          for nb in 03_calibration_model 04_blind_validation 05_step_response 06_dynamic_tracking 07_stability_and_drift 08_uncertainty_budget 09_monte_carlo 10_final_validation; do
            cp "/tmp/executed_notebooks/${nb}.ipynb" "notebooks/${nb}.ipynb"
          done
          git add             notebooks/03_calibration_model.ipynb             notebooks/04_blind_validation.ipynb             notebooks/05_step_response.ipynb             notebooks/06_dynamic_tracking.ipynb             notebooks/07_stability_and_drift.ipynb             notebooks/08_uncertainty_budget.ipynb             notebooks/09_monte_carlo.ipynb             notebooks/10_final_validation.ipynb             reports/figures/hv011_uncertainty_components.png             reports/figures/hv011_expanded_uncertainty_by_point.png             reports/figures/hv012_mc_interval_comparison.png             reports/figures/hv012_mc_representative_distribution.png             reports/figures/hv013_compliance_status.png             reports/figures/hv013_final_evidence_summary.png
          if git diff --cached --quiet; then
            echo "No evidence snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit2: snapshot final generated evidence [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: |
            /tmp/executed_notebooks
            reports/figures
            reports/tables
          if-no-files-found: error
