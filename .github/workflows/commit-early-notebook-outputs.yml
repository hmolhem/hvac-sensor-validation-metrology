name: Commit early notebook outputs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/portfolio-v1-notebook-outputs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Execute notebooks 00-02 in place
        run: |
          for nb in             notebooks/00_dataset_qualification.ipynb             notebooks/01_static_characterization.ipynb             notebooks/02_repeatability_reproducibility.ipynb
          do
            jupyter nbconvert --to notebook --execute "$nb" --ExecutePreprocessor.timeout=600 --inplace
          done
      - name: Verify no workstation-specific paths remain
        run: |
          ! grep -R "MyDocument" notebooks/00_dataset_qualification.ipynb notebooks/01_static_characterization.ipynb notebooks/02_repeatability_reproducibility.ipynb
      - name: Commit executed notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/00_dataset_qualification.ipynb notebooks/01_static_characterization.ipynb notebooks/02_repeatability_reproducibility.ipynb
          git diff --cached --quiet && exit 0
          git commit -m "Notebooks: commit clean executed outputs for 00-02"
          git push origin HEAD:release/portfolio-v1-notebook-outputs
